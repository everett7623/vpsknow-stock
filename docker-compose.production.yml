services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpsknow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vpsknow_stock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @vpsknow/database db:push
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @vpsknow/worker start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_STOCK_CHANNEL_ID: ${TELEGRAM_STOCK_CHANNEL_ID:-@vpsknow_stock}
      TELEGRAM_OFFERS_CHANNEL_ID: ${TELEGRAM_OFFERS_CHANNEL_ID:-@vpsknow_offers}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:?TELEGRAM_ADMIN_CHAT_ID is required}
      AFFILIATE_BASE_URL: ${AFFILIATE_BASE_URL:-https://go.uukk.de}
      HOSTHATCH_API_TOKEN: ${HOSTHATCH_API_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @vpsknow/bot start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-data:
