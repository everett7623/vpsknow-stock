services:
  postgres:
    image: postgres:17-alpine
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpsknow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vpsknow_stock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    init: true
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - pnpm --filter @vpsknow/database db:deploy && pnpm --filter @vpsknow/database db:seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runtime
    command: pnpm --filter @vpsknow/worker start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_OFFERS_CHANNEL_ID: ${TELEGRAM_OFFERS_CHANNEL_ID:-@vpsknow_offers}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:?TELEGRAM_ADMIN_CHAT_ID is required}
      AFFILIATE_BASE_URL: ${AFFILIATE_BASE_URL:-https://go.uukk.de}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  bot:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @vpsknow/bot start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  web:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @vpsknow/web start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpsknow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpsknow_stock}
      AFFILIATE_BASE_URL: ${AFFILIATE_BASE_URL:-https://go.uukk.de}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      ADMIN_DASHBOARD_TOKEN: ${ADMIN_DASHBOARD_TOKEN:?ADMIN_DASHBOARD_TOKEN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
